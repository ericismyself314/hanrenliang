<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>含人量 · 大学生人类状态检测站</title>
<style>
  :root {
    --ink: #16233d;
    --ink-2: rgba(22, 35, 61, 0.72);
    --ink-3: rgba(22, 35, 61, 0.48);
    --ink-4: rgba(22, 35, 61, 0.18);
    --paper: #f3f6fb;
    --white: #ffffff;
    --signal: #62e6d2;
    --accent: #9c8cff;
    --warn: #c65d4e;
    --hair: rgba(22, 35, 61, 0.12);
    --hair-soft: rgba(22, 35, 61, 0.07);
    --mono: 'SF Mono', 'DIN Alternate', 'Roboto Mono', Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'HarmonyOS Sans SC',
      'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif;
    --gutter: 24px;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    background: #dce5f1;
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    -webkit-tap-highlight-color: transparent;
  }

  .frame {
    max-width: 420px;
    min-height: 100vh;
    margin: 0 auto;
    background: linear-gradient(180deg, #fbfdff 0%, var(--paper) 24%, var(--paper) 100%);
    box-shadow: 0 0 0 1px rgba(17, 17, 16, 0.06), 0 20px 50px rgba(17, 17, 16, 0.14);
    padding: 0 var(--gutter) 72px;
    overflow: hidden;
  }

  /* ============ 通用排版 ============ */

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 1.8px;
    line-height: 1.4;
    color: var(--ink-3);
    margin: 0 0 16px;
  }
  .eyebrow i {
    width: 7px;
    height: 7px;
    flex: none;
    background: var(--signal);
    border: 1px solid var(--ink);
    border-radius: 50%;
  }

  .h1 {
    font-size: 31px;
    line-height: 1.34;
    font-weight: 700;
    letter-spacing: -0.6px;
    margin: 0;
  }
  /* 主题词只用下划线强调，不用背景块，避免行间叠色 */
  .h1 u {
    text-decoration: none;
    border-bottom: 6px solid var(--signal);
    padding-bottom: 2px;
  }

  .h2 {
    font-size: 23px;
    line-height: 1.42;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 0;
  }

  .body {
    font-size: 15px;
    line-height: 1.9;
    color: var(--ink-2);
    margin: 16px 0 0;
  }

  .prose {
    font-size: 15px;
    line-height: 1.95;
    color: var(--ink-2);
    letter-spacing: 0.2px;
    margin: 0;
  }

  .foot {
    font-size: 11.5px;
    line-height: 1.8;
    color: rgba(17, 17, 16, 0.34);
    text-align: center;
    margin: 28px 0 0;
  }

  /* ============ 顶部品牌条 ============ */

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 62px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 32px;
  }
  .topbar .mark {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
  }
  .topbar .sub {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--ink-3);
  }

  /* ============ 参数表 ============ */

  .spec {
    margin-top: 28px;
    border-top: 1px solid var(--hair);
  }
  .spec-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 42px;
    border-bottom: 1px solid var(--hair-soft);
    font-size: 13px;
  }
  .spec-row span { color: var(--ink-3); }
  .spec-row b {
    font-family: var(--mono);
    font-weight: 500;
    font-size: 13px;
    letter-spacing: 0.5px;
  }

  /* ============ 按钮 ============ */

  .btn {
    display: block;
    width: 100%;
    height: 52px;
    border: 1px solid var(--ink);
    border-radius: 14px;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    margin-top: 22px;
    box-shadow: 0 8px 18px rgba(17, 17, 16, 0.1);
  }
  .btn:active { opacity: 0.86; }
  .btn.signal { background: var(--signal); color: var(--ink); }
  .btn.ghost {
    background: transparent;
    color: var(--ink);
    border-color: var(--ink-4);
    margin-top: 12px;
    font-weight: 500;
    box-shadow: none;
  }

  .link {
    background: none;
    border: none;
    padding: 0;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--ink-3);
    letter-spacing: 0.5px;
    cursor: pointer;
  }
  .link:disabled { opacity: 0.3; cursor: default; }

  /* 首页次要入口，做成一排文字链接，不再占用按钮层级 */
  .altrow {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 22px;
    margin-top: 20px;
  }

  /* 体验版的结果一览/邀请入口仅供验收，不占用真实首页的注意力。 */
  .demo-tools { display: none; }

  .home-kicker {
    display: inline-block;
    padding: 6px 10px;
    border-radius: 999px;
    background: var(--signal);
    color: var(--ink);
    font-size: 11px;
    letter-spacing: 1.5px;
  }
  .home-page { text-align: center; }
  .home-page .topbar { text-align: left; }
  .home-page .home-kicker { margin-top: 42px; }
  .home-page .h1 { margin-top: 24px; font-size: 32px; line-height: 1.28; }
  .home-slogan {
    margin: 18px 0 0;
    color: var(--ink-2);
    font-size: 17px;
    line-height: 1.65;
  }
  .home-page .btn { margin-top: 34px; }
  .home-meta {
    margin-top: 72px;
    color: var(--ink-3);
    font-size: 11px;
    letter-spacing: 1px;
    text-align: center;
  }

  .home-page .home-slogan {
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
  }
  .home-page .btn { max-width: 320px; margin-left: auto; margin-right: auto; }

  /* ============ 答题页 ============ */

  .qhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--ink);
    margin-bottom: 28px;
  }
  .q-no {
    font-family: var(--mono);
    font-size: 40px;
    line-height: 1;
    font-weight: 400;
    letter-spacing: -1px;
    font-variant-numeric: tabular-nums;
  }
  .q-tag {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--ink-3);
  }

  .q-text {
    font-size: 20px;
    line-height: 1.66;
    font-weight: 600;
    letter-spacing: -0.2px;
    margin: 0 0 28px;
  }

  .qprogress {
    height: 6px;
    margin: -16px 0 28px;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(17, 17, 16, 0.1);
  }
  .qprogress i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--signal);
    transition: width 0.18s ease;
  }

  .opts { border-top: 0; }
  .opt {
    display: flex;
    align-items: center;
    width: 100%;
    text-align: left;
    background: rgba(255, 255, 255, 0.62);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 16px 15px;
    margin-bottom: 10px;
    font-family: var(--sans);
    font-size: 14.5px;
    line-height: 1.65;
    color: var(--ink);
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }
  .opt .t { flex: 1; min-width: 0; }
  .opt.on {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
    box-shadow: 0 8px 16px rgba(22, 35, 61, 0.12);
  }

  .qfoot { display: flex; gap: 24px; margin-top: 22px; }

  /* ============ 结算页 ============ */

  .report-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--ink);
    margin-bottom: 32px;
  }
  .report-head .t { font-size: 15px; font-weight: 700; letter-spacing: 3px; }
  .report-head .r {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1.4px;
    color: var(--ink-3);
  }

  .hero { text-align: center; }
  .hero-label {
    font-size: 11.5px;
    letter-spacing: 6px;
    text-indent: 6px;
    color: var(--ink-3);
  }
  .hero-num {
    font-family: var(--mono);
    font-size: 84px;
    line-height: 1.1;
    font-weight: 500;
    letter-spacing: -2px;
    font-variant-numeric: tabular-nums;
    margin: 2px 0 0;
  }
  .hero-num span {
    font-size: 26px;
    letter-spacing: 0;
    color: var(--ink-3);
    margin-left: 4px;
  }
  .hero-bar {
    height: 10px;
    border: 1px solid var(--ink);
    border-radius: 999px;
    overflow: hidden;
    background: var(--white);
    margin-top: 16px;
  }
  .hero-bar i { display: block; height: 100%; background: var(--signal); }
  .hero-scale {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 9.5px;
    color: var(--ink-3);
    margin-top: 8px;
  }
  .hero-scale .mid { font-family: var(--sans); font-size: 11px; }
  .hero-caption {
    font-size: 11.5px;
    line-height: 1.6;
    color: var(--ink-3);
    margin-top: 4px;
  }

  .species {
    text-align: center;
    margin-top: 36px;
  }
  .species-name {
    display: inline-block;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 1px;
    padding-bottom: 4px;
    border-bottom: 6px solid var(--signal);
  }
  .species-label {
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }
  .species-verdict {
    font-size: 15px;
    line-height: 1.8;
    color: var(--ink-2);
    margin: 18px 0 0;
  }
  .portrait-verdict {
    margin: 0 0 14px;
    padding-left: 14px;
    border-left: 3px solid var(--aqua);
    color: var(--ink-2);
    font-size: 16px;
    line-height: 1.8;
    font-weight: 650;
  }
  .hero-verdict {
    margin: 18px 8px 0;
    padding: 13px 16px;
    border: 1px solid rgba(22, 35, 61, 0.1);
    border-left: 3px solid var(--aqua);
    border-radius: 14px;
    background: rgba(255, 255, 255, 0.56);
    text-align: left;
  }

  /* ============ 区块 ============ */

  .block { margin-top: 44px; }
  .block-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--hair);
    margin-bottom: 20px;
  }
  .block-no {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-3);
    flex: none;
  }
  .block-title { font-size: 13.5px; font-weight: 700; letter-spacing: 3px; }

  /* 六维 */
  .dim {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid var(--hair-soft);
  }
  .dim:last-child { border-bottom: none; }
  .dim .n {
    flex: none;
    width: 66px;
    font-size: 13px;
    color: var(--ink-2);
    letter-spacing: 0.5px;
  }
  .dim .n.key { font-weight: 700; color: var(--ink); }
  .dim .t {
    flex: 1;
    min-width: 0;
    height: 6px;
    background: rgba(17, 17, 16, 0.09);
    border-radius: 999px;
    overflow: hidden;
  }
  .dim .t i { display: block; height: 100%; background: var(--ink); border-radius: 999px; }
  .dim .t i.key { background: var(--signal); box-shadow: inset 0 0 0 1px rgba(17, 17, 16, 0.4); }
  .dim .v {
    flex: none;
    width: 30px;
    text-align: right;
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }

  /* 人味分布 */
  .cell + .cell { margin-top: 24px; }
  .cell-t {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ink-3);
    margin-bottom: 8px;
  }
  .cell-t.warn { color: var(--warn); }
  .cell p { font-size: 14.5px; line-height: 1.8; color: var(--ink-2); margin: 0; }

  /* 面板 */
  .panel {
    background: var(--white);
    border: 1px solid var(--hair);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 8px 22px rgba(17, 17, 16, 0.04);
  }
  .panel .big {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1px;
    margin: 0 0 10px;
  }
  .panel p { font-size: 14px; line-height: 1.8; color: var(--ink-2); margin: 0; }

  .quote {
    border-left: 3px solid var(--signal);
    padding: 4px 0 4px 14px;
    font-size: 14px;
    line-height: 1.8;
    color: var(--ink-2);
  }
  .quote + .quote { margin-top: 14px; }
  .quote.dim2 { border-left-color: var(--ink-4); color: var(--ink-3); font-size: 13px; }

  .note-line {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--hair);
    font-size: 12.5px;
    color: var(--ink-3);
  }

  /* ============ 双人 ============ */

  .duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .duo .panel { text-align: center; padding: 18px 12px; }
  .duo .who {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 1.6px;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .duo .nm { font-size: 14.5px; font-weight: 600; line-height: 1.55; }
  .duo .sc {
    font-family: var(--mono);
    font-size: 22px;
    margin-top: 8px;
    font-variant-numeric: tabular-nums;
  }
  .duo .sc span { font-size: 11px; color: var(--ink-3); margin-left: 2px; }

  /* ============ 表单 ============ */

  .field { margin-top: 24px; }
  .field-t {
    font-size: 12px;
    letter-spacing: 2px;
    color: var(--ink-3);
    margin-bottom: 10px;
  }
  .field-t b {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: 0;
  }
  .select {
    width: 100%;
    height: 46px;
    border: 1px solid var(--ink-4);
    border-radius: 6px;
    background: var(--white);
    padding: 0 12px;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--ink);
  }
  .range { width: 100%; margin-top: 4px; accent-color: #111110; }

  /* ============ 品牌收束 ============ */

  .brand {
    margin: 56px calc(var(--gutter) * -1) -64px;
    padding: 32px var(--gutter) 40px;
    background: var(--ink);
    color: var(--paper);
    text-align: center;
  }
  .brand .w {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 12px;
    text-indent: 12px;
  }
  .brand .e {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 3px;
    color: rgba(246, 245, 240, 0.45);
    margin-top: 12px;
  }

  /* ============ 结果一览（预览用） ============ */

  .gallery {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
  }
  .chip {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--white);
    border: 1px solid var(--hair);
    border-radius: 12px;
    padding: 12px 12px 13px;
    font-family: var(--sans);
    cursor: pointer;
  }
  .chip:active { background: var(--signal); }
  .chip .ci {
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 1px;
    color: var(--ink-3);
  }
  .chip .cn {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.45;
    margin-top: 4px;
    letter-spacing: 0.3px;
  }
  .chip .cs {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-3);
    margin-top: 5px;
  }

  /* ============ 专属物种小人 ============ */

  .avatar-wrap {
    width: 152px;
    height: 152px;
    margin: -12px auto 8px;
  }
  .avatar-art {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 8px 10px rgba(22, 35, 61, 0.12));
  }
  .avatar-mini {
    width: 64px;
    height: 64px;
    margin: 8px auto 10px;
  }
  .chip-avatar {
    width: 66px;
    height: 66px;
    margin-bottom: 7px;
  }

  .result-hero {
    padding: 18px 14px 26px;
    background: linear-gradient(145deg, #ffffff 0%, #eef8fb 100%);
    border: 1px solid rgba(22, 35, 61, 0.1);
    border-radius: 22px;
  }
  .result-hero .species {
    margin-top: 0;
  }
  .result-actions {
    margin-top: 16px;
  }
  .result-bridge {
    margin: 0 0 16px;
    padding: 16px 18px 17px;
    border: 1px solid rgba(22, 35, 61, 0.1);
    border-radius: 16px;
    background: rgba(255, 255, 255, 0.72);
    text-align: center;
  }
  .bridge-label {
    color: var(--ink-3);
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .bridge-title {
    margin-top: 5px;
    font-size: 17px;
    font-weight: 700;
  }
  .result-bridge p {
    margin: 5px 0 0;
    color: var(--ink-2);
    font-size: 13px;
    line-height: 1.65;
  }
  .btn.quiet {
    background: rgba(255, 255, 255, 0.45);
    color: var(--ink-2);
    border-color: var(--hair);
    box-shadow: none;
    font-size: 13px;
  }
  .share-status {
    padding-top: 10px;
    color: #5d55b8;
    font-size: 12px;
    text-align: center;
  }
  .share-hint {
    margin: 10px 0 0;
    color: var(--ink-3);
    font-size: 11px;
    line-height: 1.55;
    text-align: center;
  }
  .portrait-note,
  .section-note {
    color: var(--ink-3);
    font-size: 12px;
    line-height: 1.7;
  }
  .portrait-note {
    margin: -8px 0 16px;
    padding: 12px 13px;
    background: #e4ecf8;
    border-radius: 12px;
  }
  .section-note { margin: -8px 0 4px; }
  .insight-card {
    padding: 14px 15px 15px;
    border-radius: 14px;
    margin-bottom: 10px;
  }
  .insight-card:last-child { margin-bottom: 0; }
  .insight-positive {
    background: rgba(98, 230, 210, 0.2);
    border: 1px solid rgba(53, 170, 157, 0.2);
  }
  .insight-watch {
    background: rgba(156, 140, 255, 0.13);
    border: 1px solid rgba(93, 85, 184, 0.14);
  }
  .insight-card .cell-t { margin-bottom: 7px; color: var(--ink-3); }
  .insight-card p { margin: 0; color: var(--ink-2); font-size: 13px; line-height: 1.75; }
  .radar-demo {
    width: 240px;
    height: 240px;
    margin: -8px auto 4px;
  }
  .radar-svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .radar-grid { fill: none; stroke: rgba(22, 35, 61, 0.14); stroke-width: 1; }
  .radar-axis { stroke: rgba(22, 35, 61, 0.12); stroke-width: 1; }
  .radar-data { fill: rgba(98, 230, 210, 0.42); stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
  .radar-svg circle { fill: var(--ink); }
  .radar-svg .key-dot { fill: var(--accent); }
  .radar-svg text { fill: var(--ink-3); font-size: 9px; font-family: var(--sans); }
  .share-action {
    margin-top: 12px;
    text-align: center;
  }
  .share-action .link { color: #5d55b8; }
  .duo .panel .avatar-mini { margin-top: 0; }

  @media (max-width: 360px) {
    .frame { padding-left: 18px; padding-right: 18px; }
    .h1 { font-size: 28px; }
    .avatar-wrap { width: 136px; height: 136px; }
  }

  @media (max-width: 360px) {
    .hero-num { font-size: 72px; }
    .h1 { font-size: 28px; }
  }
  .prose { white-space: pre-line; }
  .radar-demo { max-width: 100%; margin: 0 auto; }

      index = 0;
      screen = "home";
      render();
    });
    return node;
  }
  function loadSharedPreview() {
    if (typeof window === "undefined") return;
    const location = window.location;
    if (!location || typeof URLSearchParams === "undefined") return;
    const params = new URLSearchParams(location.search);
    const resultId = params.get("result") || "";
    const score = Number(params.get("score"));
    const def = getResult(resultId);
    if (!def || params.get("score") === null || !Number.isInteger(score) || score < 0 || score > 100 || Math.min(3, Math.floor(score / 25)) !== def.band) return;
    sharedPreview = { title: def.title, score, resultId: def.id };
    screen = "home";
  }
  loadSharedPreview();
  render();
})();

  </script>
</body>
